apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
    spec:
      serviceAccountName: employee-api-vault
      containers:
        - name: employee-api
          image: ghcr.io/abiamahladi/employee-api:v2
          ports:
            - containerPort: 5000
          env:
            - name: DB_NAME
              value: employee_db
            - name: DB_USER
              value: postgres
            - name: DB_HOST
              value: employee-db
            - name: DB_PORT
              value: "5432"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: password
